[tasks.lint]
description = "Run linters on the project"
run = "scripts/dispatch lint"
#   uv run ruff check . $(ARGS)

[tasks.clippy]
description = "Run clippy on the project"
run = "scripts/dispatch clippy"

[tasks.format]
description = "Run formatters on the project"
run = "scripts/dispatch format"
#   uv run ruff format . $(ARGS)

[tasks.fmt]
description = "Run formatters on the project"
run = "scripts/dispatch fmt"

[tasks.typecheck]
description = "Run type checkers on the project"
run = "scripts/dispatch typecheck"
#   uv run mypy .
#   uv run pyright .

[tasks.dev]
description = "Run the project in development mode"
run = "scripts/dispatch dev"

[tasks.run]
description = "Run the project"
run = "scripts/dispatch run"

[tasks.start]
description = "Start the project"
run = "scripts/dispatch start"

[tasks.docs]
description = "Build the documentation"
run = "scripts/dispatch docs"
