# tfsec = "latest"
copier = "latest"
difftastic = "latest"
fd = "latest"
fnox = "latest"
gemini = "latest"
hyperfine = "latest"
node = "22"
prek = "latest"
python = ["3.10", "3.11", "3.12", "3.13"]
ruff = "latest"
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
usage = "latest"
uv = "latest"

[tasks.docker]
description = "Run a shell in the latest mise docker image"
run = "docker run --pull=always -it --rm --entrypoint bash jdxcode/mise:latest"

[tasks.pin]
description = "Pin a tool to the latest version in the registry (uses fzf to select the tool)"
run = "mise use --pin $(mise registry | fzf --multi | awk '{print $2}')"

# dispatch tasks to other tasks

[tasks.bootstrap]
run = "scripts/dispatch bootstrap"
description = "Bootstrap the project by installing dependencies and running setup tasks"
#   uv sync

[tasks.doctor]
description = "Run a series of checks to ensure the project is healthy"
run = "scripts/dispatch doctor"
#   verify required tools are installed
#   uv run lint
#   uv run typecheck
#   uv run test
#   uv run coverage

[tasks.test]
description = "Run tests on the project"
run = "~/.config/mise/scripts/dispatch test"
