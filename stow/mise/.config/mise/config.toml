[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
# python_compile = true

## setting the following will enable reading .env everywhere
# env_file = ".env"

## to only read .env from a particular project directory, include the following within the project's [.]mise.[local.]toml file
# [env]
# _.file = '.env'

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[env]
# Use default profile
_.fnox-env = { tools = true }
# Use production profile
# _.fnox-env = { tools = true, profile = "production" }

[tools]
# "go:github.com/containerscrew/tftools" = "latest"
# "pipx:flake8" = "latest"
# "pipx:isort" = "latest"
# "pipx:pylint" = "latest"
"pipx:audible-cli" = "latest"
"pipx:ipython" = "latest"
"pipx:tmuxp" = "latest"
# bats = "latest"
# black = "latest"
# cookiecutter = "latest"
# node = "latest"
# pipx = "latest"
# terraform = "latest"
# tflint = "latest"
# tfsec = "latest"
bat = "latest"
claude = "latest"
codex = "latest"
copier = "latest"
fd = "latest"
fnox = "latest"
hyperfine = "latest"
node = "20"
pre-commit = "latest"
prek = "latest"
python = ["3.13", "3.12", "3.11", "3.10"]
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
usage = "latest"
uv = "latest"
